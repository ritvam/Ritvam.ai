<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ritvam</title>
    <script>
      (function () {
        var path = window.location.pathname;
        if (path.indexOf('/admin-dashboard') === 0) {
          sessionStorage.setItem('adminRedirect', window.location.href);
          window.location.replace('/admin-dashboard/');
        } else {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body></body>
</html>
